name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please **do not paste your email, password or stream URLs containing keys.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: addictune version
      placeholder: "0.2.0 (binary or source)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network and tab
      placeholder: "DI.FM, Channels"
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Run `addictune --dev` and paste the relevant lines (redacted).
      render: text
